name: Send cold emails

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send emails
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          SOFTWARE_RESUME_LINK: ${{ secrets.SOFTWARE_RESUME_LINK }}
          DATA_RESUME_LINK: ${{ secrets.DATA_RESUME_LINK }}
          LINKEDIN_LINK: ${{ secrets.LINKEDIN_LINK }}
        run: python src/send_cold_emails.py

      - name: Commit CSV updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hr_emails.csv data/sent_emails.csv
          if git diff --cached --quiet; then
            echo "No CSV updates to commit."
          else
            git commit -m "Update email send status"
            git push
          fi
